<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      WEB-6: Vorlage für den Web-Export (Expo hängt Skripte und CSS an).
      1. Ladebildschirm in reinem HTML und CSS: steht sofort, statt weißer Seite, bis die App da ist.
      2. Preload: CanvasKit (Skia, 8 MB WebAssembly) und die Schriften laden parallel zum JavaScript,
         statt erst danach. Die Pfade tragen den Inhalts-Hash von Metro; src/perf/__tests__/preload.test.ts
         prüft, dass sie zu den installierten Paketen passen.
      3. Service Worker (sw.js): beim zweiten Besuch kommen CanvasKit und Bundles aus dem Speicher.
    -->
    <link rel="preload" href="/pou/assets/node_modules/canvaskit-wasm/bin/full/canvaskit.d614134b66b587cafc440b5d8d238717.wasm" as="fetch" type="application/wasm" crossorigin />
    <link rel="preload" href="/pou/assets/node_modules/@expo-google-fonts/nunito/400Regular/Nunito_400Regular.f04f0e9ff969fd52a75deade3a9761cd.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/pou/assets/node_modules/@expo-google-fonts/nunito/700Bold/Nunito_700Bold.c133c0b8cd169e7798d0cd239477cf32.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/pou/assets/node_modules/@expo-google-fonts/fredoka/600SemiBold/Fredoka_600SemiBold.89a2d8224922009e6f9b96181093b634.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/pou/assets/node_modules/@expo-google-fonts/fredoka/700Bold/Fredoka_700Bold.eaa34632fd156f78e16a584d1648ffcc.ttf" as="font" type="font/ttf" crossorigin />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #fff4e0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="boot-style">
      /* ART-5: Ladebildschirm im Spiele-Look. Warmer Verlauf, kreisende Lichtstrahlen, Topf hüpft mit
         Squash & Stretch, dicker Ladebalken mit Kontur und Streifen. Nur CSS, steht sofort. */
      @font-face {
        font-family: 'BootFredoka';
        src: url('/pou/assets/node_modules/@expo-google-fonts/fredoka/700Bold/Fredoka_700Bold.eaa34632fd156f78e16a584d1648ffcc.ttf') format('truetype');
        font-display: swap;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.55), transparent 55%),
          linear-gradient(180deg, #ffa94d 0%, #ffd58a 55%, #fff4e0 100%);
        font-family: 'BootFredoka', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #2f5d3a;
        transition: opacity 0.3s ease-out, transform 0.3s ease-out;
      }
      #boot.gone {
        opacity: 0;
        transform: scale(1.06);
        pointer-events: none;
      }
      #boot .rays {
        position: absolute;
        left: 50%;
        top: 34%;
        width: 160vmax;
        height: 160vmax;
        margin: -80vmax 0 0 -80vmax;
        background: repeating-conic-gradient(rgba(255, 255, 255, 0.22) 0deg 12deg, transparent 12deg 30deg);
        border-radius: 50%;
        animation: boot-turn 18s linear infinite;
      }
      #boot .title {
        position: relative;
        margin: 0;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #ffd45c;
        -webkit-text-stroke: 3px #2b2b2b;
        paint-order: stroke fill;
        text-shadow: 0 5px 0 #2b2b2b;
      }
      #boot .pot {
        position: relative;
        width: 96px;
        height: 132px;
        transform-origin: 50% 100%;
        animation: boot-hop 1.3s ease-in-out infinite;
      }
      #boot .shadow {
        position: relative;
        width: 90px;
        height: 14px;
        margin-top: -30px;
        border-radius: 50%;
        background: rgba(47, 41, 60, 0.22);
        animation: boot-shadow 1.3s ease-in-out infinite;
      }
      #boot .leaf {
        position: absolute;
        left: 18px;
        top: 0;
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #a6e39a, #7bc96f 55%, #5dae55);
        border: 4px solid #2f5d3a;
        border-radius: 8% 50% 50% 50%;
        transform: rotate(45deg);
        transform-origin: 50% 100%;
        box-sizing: border-box;
        animation: boot-sway 1.3s ease-in-out infinite;
      }
      #boot .tub {
        position: absolute;
        left: 8px;
        bottom: 0;
        width: 80px;
        height: 64px;
        background: linear-gradient(180deg, #e39a72, #c9734a 45%, #a95c3a);
        border: 4px solid #2f5d3a;
        border-bottom-width: 7px;
        border-radius: 6px 6px 22px 22px;
        box-sizing: border-box;
      }
      #boot .tub::before {
        content: '';
        position: absolute;
        left: 22px;
        top: 18px;
        width: 8px;
        height: 10px;
        border-radius: 50%;
        background: #2b2b2b;
        box-shadow: 20px 0 0 #2b2b2b;
        animation: boot-blink 3.2s infinite;
      }
      #boot .tub::after {
        content: '';
        position: absolute;
        left: 8px;
        top: 6px;
        width: 14px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
      }
      #boot .bar {
        position: relative;
        width: 200px;
        height: 22px;
        border-radius: 12px;
        background: #fff4e0;
        border: 3px solid #2b2b2b;
        border-bottom-width: 5px;
        overflow: hidden;
        box-sizing: border-box;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        border-radius: 8px;
        background: repeating-linear-gradient(-45deg, #ff7a8a 0 8px, #ff9dab 8px 16px);
        box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.45);
        animation: boot-run 1.2s ease-in-out infinite;
      }
      #boot p {
        position: relative;
        margin: 0;
        font-size: 19px;
        font-weight: 700;
      }
      #boot a {
        position: relative;
        color: #2f5d3a;
        font-size: 15px;
      }
      @keyframes boot-turn {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-hop {
        0%,
        100% {
          transform: translateY(0) scale(1.08, 0.9);
        }
        15% {
          transform: translateY(0) scale(1, 1);
        }
        45% {
          transform: translateY(-26px) scale(0.94, 1.08);
        }
        75% {
          transform: translateY(0) scale(1, 1);
        }
        85% {
          transform: translateY(0) scale(1.1, 0.88);
        }
      }
      @keyframes boot-shadow {
        0%,
        15%,
        75%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        45% {
          transform: scale(0.7);
          opacity: 0.6;
        }
      }
      @keyframes boot-sway {
        0%,
        100% {
          transform: rotate(38deg);
        }
        50% {
          transform: rotate(52deg);
        }
      }
      @keyframes boot-blink {
        0%,
        94%,
        100% {
          transform: scaleY(1);
        }
        97% {
          transform: scaleY(0.1);
        }
      }
      @keyframes boot-run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(230%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot *,
        #boot *::before,
        #boot *::after {
          animation: none !important;
        }
      }
    </style>
  </head>

  <body>
    <noscript>PotPou braucht JavaScript.</noscript>
    <div id="boot" role="status" aria-live="polite">
      <div class="rays" aria-hidden="true"></div>
      <h1 class="title">PotPou</h1>
      <div class="pot" aria-hidden="true"><div class="leaf"></div><div class="tub"></div></div>
      <div class="shadow" aria-hidden="true"></div>
      <div class="bar" aria-hidden="true"></div>
      <p>Budi wacht auf …</p>
      <a id="boot-retry" href="" hidden>Dauert lange? Neu laden</a>
    </div>
    <div id="root"></div>
    <script>
      // Ladebildschirm weg, sobald die App Text zeigt. Hängt etwas, nach 25 s einen Neu-laden-Link zeigen.
      (function () {
        var boot = document.getElementById('boot');
        var root = document.getElementById('root');
        var done = false;
        function hide() {
          if (done || !root.innerText || !root.innerText.trim()) return;
          done = true;
          observer.disconnect();
          boot.className = 'gone';
          setTimeout(function () {
            boot.remove();
          }, 300);
        }
        var observer = new MutationObserver(hide);
        observer.observe(root, { childList: true, subtree: true, characterData: true });
        setTimeout(function () {
          if (!done) document.getElementById('boot-retry').hidden = false;
        }, 25000);
      })();
      // Service Worker nur im Export (dort liegen die Bundles unter /_expo/static/), nicht im Dev-Server.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          if (!document.querySelector('script[src*="/_expo/static/js/"]')) return;
          navigator.serviceWorker
            .register('/pou/sw.js', { scope: '/pou/' })
            .then(function () {
              return navigator.serviceWorker.ready;
            })
            .then(function (registration) {
              var urls = performance.getEntriesByType('resource').map(function (e) {
                return e.name;
              });
              if (registration.active) registration.active.postMessage({ type: 'remember', urls: urls });
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
