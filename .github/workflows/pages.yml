name: Pages

# Web-Version zum Testen (Auftrag PWEB): baut main für den Browser und veröffentlicht sie auf
# GitHub Pages unter https://neinkob12.github.io/pou-/. Einmalig nötig: Settings > Pages >
# Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web exportieren (baseUrl /pou-)
        run: npx expo export --platform web
        env:
          CI: '1'
      - name: Direktlinks und Neuladen auf Unterseiten
        # Pages kennt keine SPA-Weiterleitung. 404.html fängt alles ab, die Kopien je Route
        # liefern bekannte Routen direkt mit Status 200 aus (Pages löst /shop zu shop.html auf).
        run: |
          cp dist/index.html dist/404.html
          for f in $(cd app && find . -name '*.tsx' ! -name '_layout.tsx' ! -name '+*' | sed 's|^\./||; s|\.tsx$||'); do
            case "$f" in
              index) continue ;;
              */index) f="${f%/index}" ;;
            esac
            mkdir -p "dist/$(dirname "$f")"
            cp dist/index.html "dist/$f.html"
          done
          touch dist/.nojekyll
          ls -R dist | grep '\.html' | sort | uniq -c
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
